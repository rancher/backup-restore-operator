name: Deploy Workflows

on:
  workflow_dispatch:
    inputs:
      targetBranch:
        description: "The branch to deploy workflows to (e.g., 'main', 'release/v2.0')"
        required: true
        type: string
      k3sVersions:
        description: "JSON array of K3S versions for integration tests (e.g., '[\"v1.34.5-k3s1\", \"v1.36.1-k3s1\"]')"
        required: true
        type: string
      automationCoreRef:
        description: "Automation-core ref to use (default: 'automation-core', or pin to tag like 'v1')"
        required: false
        default: "automation-core"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load Secrets from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/org/${{ github.repository_owner }}/github/app-rancher-automations appId | APP_ID ;
            secret/data/github/org/${{ github.repository_owner }}/github/app-rancher-automations privateKey | PRIVATE_KEY

      - name: Get GitHub App token
        id: get_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout automation-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.get_token.outputs.token }}
          path: automation-core
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.targetBranch }}
          token: ${{ steps.get_token.outputs.token }}
          path: target-repo
          persist-credentials: false

      - name: Create branch, apply templates, and create PR
        env:
          TARGET_BRANCH: ${{ inputs.targetBranch }}
          K3S_VERSIONS: ${{ inputs.k3sVersions }}
          AUTOMATION_CORE_REF: ${{ inputs.automationCoreRef }}
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          set -euo pipefail

          DEPLOY_BRANCH="deploy-workflows-$(date +%Y-%m-%d-%H-%M-%S)"

          git config --global user.email "119870437+renovate-rancher[bot]@users.noreply.github.com"
          git config --global user.name "renovate-rancher[bot]"
          gh auth setup-git

          cd target-repo
          git checkout -b "${DEPLOY_BRANCH}"

          # Copy workflow templates
          mkdir -p .github/workflows

          # Process ci.yaml template
          sed -e "s|{{K3S_VERSIONS}}|${K3S_VERSIONS}|g" \
              -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              ../automation-core/workflow-templates/ci.yaml.tmpl \
              > .github/workflows/ci.yaml

          # Process release.yaml template
          sed -e "s|{{K3S_VERSIONS}}|${K3S_VERSIONS}|g" \
              -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              ../automation-core/workflow-templates/release.yaml.tmpl \
              > .github/workflows/release.yaml

          # Process head-builds.yaml template
          sed -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              ../automation-core/workflow-templates/head-builds.yaml.tmpl \
              > .github/workflows/head-builds.yaml

          git add .github/workflows/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit - workflows are already up to date"
            exit 0
          fi

          git commit -m "Deploy automation-core workflows

Deployed from automation-core@${GITHUB_SHA:0:7}

Configuration:
- K3S versions: ${K3S_VERSIONS}
- Automation-core ref: @${AUTOMATION_CORE_REF}
- Target branch: ${TARGET_BRANCH}

This PR was automatically created by the workflow deployment system."

          git push origin "${DEPLOY_BRANCH}"

          CREATED_PR=$(gh pr create \
            -R "${{ github.repository }}" \
            --title "Deploy automation-core workflows to ${TARGET_BRANCH}" \
            --body "**Automated deployment of automation-core workflows**

## Configuration
- **K3S versions**: \`${K3S_VERSIONS}\`
- **Automation-core ref**: \`@${AUTOMATION_CORE_REF}\`
- **Target branch**: \`${TARGET_BRANCH}\`

## Changes
This PR updates the GitHub Actions workflows from automation-core templates.

## Source
- Automation-core commit: \`${GITHUB_SHA:0:7}\`
- Deployed by: @${GITHUB_ACTOR}

---
🤖 Generated by [automation-core workflow deployment](https://github.com/${{ github.repository }}/blob/automation-core/.github/workflows/deploy-workflows.yml)" \
            --base "${TARGET_BRANCH}" \
            --head "${DEPLOY_BRANCH}")

          {
            echo "## Deployment Summary"
            echo ""
            echo "**Target branch**: \`${TARGET_BRANCH}\`"
            echo "**K3S versions**: \`${K3S_VERSIONS}\`"
            echo "**Automation-core ref**: \`@${AUTOMATION_CORE_REF}\`"
            echo ""
            echo "**Created PR**: ${CREATED_PR}"
          } >> "$GITHUB_STEP_SUMMARY"
