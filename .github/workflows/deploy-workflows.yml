name: Deploy Workflows

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment mode"
        type: choice
        options:
          - config  # Deploy one branch from config file
          - bulk    # Deploy multiple branches
        default: config

      # Config mode input
      configFile:
        description: "Config file path (e.g., configs/release-v10.x.yaml)"
        required: false

      # Bulk mode input
      branches:
        description: "Comma-separated branches (e.g., main,release/v10.x,release/v9.x) or 'all'"
        required: false

      # Common inputs
      dryRun:
        description: "Preview changes without creating PR"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Read App Credentials from Vault
        if: github.repository_owner == 'rancher'
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App Token
        if: github.repository_owner == 'rancher'
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout automation-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation-core
          path: automation-core
          persist-credentials: false

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get_token.outputs.token }}
          path: target-repo
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'

      - name: Run deployment workflow
        env:
          MODE: ${{ inputs.mode }}
          CONFIG_FILE: ${{ inputs.configFile }}
          BRANCHES: ${{ inputs.branches }}
          TARGET_DIR: ${{ github.workspace }}/target-repo
          DRY_RUN: ${{ inputs.dryRun }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          GIT_USER_NAME: ${{ steps.get_token.outputs.app-slug }}[bot]
          GIT_USER_EMAIL: ${{ steps.get_token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          cd automation-core
          bash .github/workflows/deploy-workflows/run-gha.sh
