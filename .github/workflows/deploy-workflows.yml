name: Deploy Workflows

on:
  workflow_dispatch:
    inputs:
      targetBranch:
        description: "The branch to deploy workflows to (e.g., 'main', 'release/v2.0')"
        required: true
        type: string
      k3sVersions:
        description: "JSON array of K3S versions for integration tests (e.g., '[\"v1.34.5-k3s1\", \"v1.36.1-k3s1\"]')"
        required: true
        type: string
      automationCoreRef:
        description: "Automation-core ref to use (default: 'automation-core', or pin to tag like 'v1')"
        required: false
        default: "automation-core"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to create branches and push commits containing code/workflow edits
      pull-requests: write  # Needed to open the pull request via the GitHub API
    steps:
      - name: Read App Credentials from Vault
        if: github.repository_owner == 'rancher'
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      # Fetch github token for local repo
      - name: Generate GitHub App Token
        if: github.repository_owner == 'rancher'
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout automation-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.get_token.outputs.token }}
          path: automation-core
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.targetBranch }}
          token: ${{ steps.get_token.outputs.token }}
          path: target-repo
          persist-credentials: true

      - name: Create branch, apply templates, and create PR
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          APP_USER: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          TARGET_BRANCH: ${{ inputs.targetBranch }}
          K3S_VERSIONS: ${{ inputs.k3sVersions }}
          AUTOMATION_CORE_REF: ${{ inputs.automationCoreRef }}
        run: |
          set -euo pipefail

          DEPLOY_BRANCH="deploy-workflows-$(date +%Y-%m-%d-%H-%M-%S)"

          # Configure git identity for commits (GHA only - fresh clone deleted at workflow end)
          user_id=$(gh api "/users/$APP_USER" --jq .id)
          git config --global user.name "$APP_USER"
          git config --global user.email "${user_id}+${APP_USER}@users.noreply.github.com"

          # Create staging directory for templates
          STAGING_DIR=$(mktemp -d)

          # Process ci.yaml template
          sed -e "s|{{K3S_VERSIONS}}|${K3S_VERSIONS}|g" \
              -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              automation-core/workflow-templates/ci.yaml.tmpl \
              > "${STAGING_DIR}/ci.yaml"

          # Process release.yaml template
          sed -e "s|{{K3S_VERSIONS}}|${K3S_VERSIONS}|g" \
              -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              automation-core/workflow-templates/release.yaml.tmpl \
              > "${STAGING_DIR}/release.yaml"

          # Process head-builds.yaml template
          sed -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              automation-core/workflow-templates/head-builds.yaml.tmpl \
              > "${STAGING_DIR}/head-builds.yaml"

          # Validate YAML syntax
          echo "Validating generated workflow files..."
          for workflow in "${STAGING_DIR}"/*.yaml; do
            echo "  Validating $(basename "$workflow")..."
            yq eval '.' "$workflow" > /dev/null || {
              echo "ERROR: Invalid YAML in $(basename "$workflow")"
              exit 1
            }
          done
          echo "All workflow files are valid YAML"

          cd target-repo
          git checkout -b "${DEPLOY_BRANCH}"

          # Copy validated workflow templates to target
          mkdir -p .github/workflows
          cp "${STAGING_DIR}"/*.yaml .github/workflows/
          git add .github/workflows/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit - workflows are already up to date"
            exit 0
          fi

          # Generate commit message and save to temp file
          bash ../automation-core/.github/scripts/generate-commit-msg.sh \
            "${TARGET_BRANCH}" \
            "${K3S_VERSIONS}" \
            "${AUTOMATION_CORE_REF}" \
            "${GITHUB_SHA}" > /tmp/commit_msg

          # Commit and push
          git commit -F /tmp/commit_msg
          git push origin "${DEPLOY_BRANCH}"

          # Generate PR body and save to temp file
          bash ../automation-core/.github/scripts/generate-pr-body.sh \
            "${TARGET_BRANCH}" \
            "${K3S_VERSIONS}" \
            "${AUTOMATION_CORE_REF}" \
            "${GITHUB_SHA}" \
            "${GITHUB_ACTOR}" > /tmp/pr_body

          # Create PR
          CREATED_PR=$(gh pr create \
            -R "${{ github.repository }}" \
            --title "Deploy automation-core workflows to ${TARGET_BRANCH}" \
            --body-file /tmp/pr_body \
            --base "${TARGET_BRANCH}" \
            --head "${DEPLOY_BRANCH}")

          {
            echo "## Deployment Summary"
            echo ""
            echo "**Target branch**: \`${TARGET_BRANCH}\`"
            echo "**K3S versions**: \`${K3S_VERSIONS}\`"
            echo "**Automation-core ref**: \`@${AUTOMATION_CORE_REF}\`"
            echo ""
            echo "**Created PR**: ${CREATED_PR}"
          } >> "$GITHUB_STEP_SUMMARY"
