name: Branch head Prerelease Images

on:
  push:
    branches:
      - main
      - release/v[0-9]+.(0|x)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  head-builds:
    uses: rancher/backup-restore-operator/.github/workflows/head-builds.yaml@automation-core
    permissions:
      contents: write
      id-token: write
    secrets: inherit
