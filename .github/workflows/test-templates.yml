name: Test Templates

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'render-templates.go'
      - 'configs/**'
  push:
    branches:
      - automation-core
    paths:
      - 'templates/**'
      - 'render-templates.go'
      - 'configs/**'

jobs:
  test-render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - configs/main.yaml
          - configs/release-v10.x.yaml
          - configs/release-v9.x.yaml
          - configs/release-v8.x.yaml
          - configs/release-v7.x.yaml
          - configs/release-v6.x.yaml
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'

      - name: Validate config
        run: |
          bash .github/scripts/validate-config.sh ${{ matrix.config }}

      - name: Build renderer
        run: |
          CGO_ENABLED=0 go build -o render-templates ./render-templates.go

      - name: Render templates
        run: |
          ./render-templates \
            -config ${{ matrix.config }} \
            -template-dir templates \
            -output-dir /tmp/rendered

      - name: Validate rendered YAML
        run: |
          echo "Validating rendered workflow files..."
          for workflow in /tmp/rendered/*.yaml /tmp/rendered/*.yml; do
            if [ -f "$workflow" ]; then
              echo "  Validating $(basename "$workflow")..."
              yq eval '.' "$workflow" > /dev/null
            fi
          done
          echo "✓ All rendered workflows are valid YAML"

      - name: Upload rendered workflows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607f1ee # v6.2.0
        with:
          name: rendered-workflows-${{ matrix.config }}
          path: /tmp/rendered/
          retention-days: 7
