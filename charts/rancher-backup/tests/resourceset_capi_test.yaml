suite: ResourceSet CAPI, Turtles and Fleet selectors
tests:
  - it: basic ResourceSet should include Rancher Turtles selectors
    template: rancher-resourceset-basic.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "apiextensions.k8s.io/v1"
            resourceNameRegexp: "turtles-capi.cattle.io$"
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "turtles-capi.cattle.io/v1alpha1"
            kindsRegexp: "."

  - it: basic ResourceSet should include every CAPI provider API group
    template: rancher-resourceset-basic.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "infrastructure.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "vmware.infrastructure.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "controlplane.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "bootstrap.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "addons.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "addons.cluster.x-k8s.io/v1alpha1"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "ipam.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "runtime.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."

  - it: full ResourceSet should include the CAPI provider API groups too
    template: rancher-resourceset-full.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "infrastructure.cluster.x-k8s.io/v1beta2"
            kindsRegexp: "."
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "turtles-capi.cattle.io/v1alpha1"
            kindsRegexp: "."

  - it: full ResourceSet should include CAPI secret selectors
    template: rancher-resourceset-full.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^secrets$"
            labelSelectors:
              matchExpressions:
                - key: "cluster.x-k8s.io/cluster-name"
                  operator: "Exists"
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^secrets$"
            fieldSelectors:
              type: "addons.cluster.x-k8s.io/resource-set"

  - it: basic ResourceSet should not include any CAPI secret selectors
    template: rancher-resourceset-basic.yaml
    asserts:
      - notContains:
          path: resourceSelectors
          any: true
          content:
            kindsRegexp: "^secrets$"
            labelSelectors:
              matchExpressions:
                - key: "cluster.x-k8s.io/cluster-name"
                  operator: "Exists"
      - notContains:
          path: resourceSelectors
          any: true
          content:
            kindsRegexp: "^secrets$"
            fieldSelectors:
              type: "addons.cluster.x-k8s.io/resource-set"

  - it: full ResourceSet should include Fleet bundle-values and OCI storage secrets
    template: rancher-resourceset-full.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^secrets$"
            namespaceRegexp: "^cattle-fleet-|^fleet-"
            fieldSelectors:
              type: "fleet.cattle.io/bundle-values/v1alpha1"
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^secrets$"
            namespaceRegexp: "^cattle-fleet-|^fleet-"
            fieldSelectors:
              type: "fleet.cattle.io/bundle-oci-storage/v1alpha1"

  - it: basic ResourceSet should not include Fleet bundle-values secrets
    template: rancher-resourceset-basic.yaml
    asserts:
      - notContains:
          path: resourceSelectors
          any: true
          content:
            kindsRegexp: "^secrets$"
            fieldSelectors:
              type: "fleet.cattle.io/bundle-values/v1alpha1"

  - it: both ResourceSets should honour the resources.cattle.io/backup opt-in on namespaces and configmaps
    templates:
      - rancher-resourceset-basic.yaml
      - rancher-resourceset-full.yaml
    asserts:
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^namespaces$"
            labelSelectors:
              matchExpressions:
                - key: "resources.cattle.io/backup"
                  operator: "In"
                  values: ["true"]
      - contains:
          path: resourceSelectors
          any: true
          content:
            apiVersion: "v1"
            kindsRegexp: "^configmaps$"
            namespaceRegexp: "^.*$"
            labelSelectors:
              matchExpressions:
                - key: "resources.cattle.io/backup"
                  operator: "In"
                  values: ["true"]
