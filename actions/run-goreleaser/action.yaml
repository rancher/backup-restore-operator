name: run-goreleaser
description: Execute goreleaser and validate outputs

inputs:
  github-token:
    description: GitHub token for goreleaser
    required: true
  tag:
    description: The release tag
    required: false
    default: ${{ github.ref_name }}

outputs:
  metadata:
    description: Contents of dist/metadata.json
    value: ${{ steps.goreleaser.outputs.metadata }}
  artifacts:
    description: Contents of dist/artifacts.json
    value: ${{ steps.goreleaser.outputs.artifacts }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - run: git fetch --force --tags
      shell: bash

    - name: Install go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: 1.26

    - name: Checkout bin-deps config to local branch
      shell: bash
      run: git checkout automation-core -- .bin-deps.yaml

    - uses: rancherlabs/dep-fetch/actions/sync-deps@c20b0b0e73e0819fd96fab41e1ee8987714dd04b # v0.3.0

    - name: Run goreleaser
      id: goreleaser
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      shell: bash
      run: |-
        goreleaser release --clean
        if [[ ! -f dist/metadata.json ]] || [[ ! -s dist/metadata.json ]]; then
          echo "Missing required file: dist/metadata.json"
          exit 1
        fi
        if [[ ! -f dist/artifacts.json ]] || [[ ! -s dist/artifacts.json ]]; then
          echo "Missing required file: dist/artifacts.json"
          exit 1
        fi
        echo "metadata=$(tr -d '\n\r' < dist/metadata.json)" >> "${GITHUB_OUTPUT}"
        echo "artifacts=$(tr -d '\n\r' < dist/artifacts.json)" >> "${GITHUB_OUTPUT}"
