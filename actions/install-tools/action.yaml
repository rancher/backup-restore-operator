name: install-tools
description: Install helm v4 and yq with checksum verification

runs:
  using: composite
  steps:
    - name: Install Helm v4
      shell: bash
      run: |
        # helm v4.2.3
        case "$(uname -m)" in
          x86_64)  ARCH=amd64; CHECKSUM="e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c" ;;
          aarch64) ARCH=arm64; CHECKSUM="21abd9354d39b2cd79a8d76be6912cd137a983cbf997193503fb8a6a6e2f2785" ;;
          *) echo "Unsupported: $(uname -m)"; exit 1 ;;
        esac
        TMP_DIR=$(mktemp -d)
        TMP_FILE="${TMP_DIR}/helmv4.tar.gz"
        curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
          "https://get.helm.sh/helm-v4.2.3-linux-${ARCH}.tar.gz" > "${TMP_FILE}"
        printf "%s  %s\n" "${CHECKSUM}" "${TMP_FILE}" | sha256sum -c -
        tar xzf "${TMP_FILE}" -C "${TMP_DIR}"
        install "${TMP_DIR}/linux-${ARCH}/helm" /usr/local/bin/helm
        rm -rf "${TMP_DIR}"
        helm version

    - name: Install yq
      shell: bash
      run: |
        # yq v4.54.1
        case "$(uname -m)" in
          x86_64)  ARCH=amd64; CHECKSUM="8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f" ;;
          aarch64) ARCH=arm64; CHECKSUM="189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b" ;;
          *) echo "Unsupported: $(uname -m)"; exit 1 ;;
        esac
        TMP_DIR=$(mktemp -d)
        curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
          "https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_${ARCH}" > "${TMP_DIR}/yq"
        printf "%s  %s\n" "${CHECKSUM}" "${TMP_DIR}/yq" | sha256sum -c -
        install "${TMP_DIR}/yq" /usr/local/bin/yq
        rm -rf "${TMP_DIR}"
