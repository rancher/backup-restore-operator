name: release
description: Run goreleaser, publish container images, and un-draft the GitHub release

inputs:
  github-token:
    description: Token used for goreleaser, gh CLI calls, and undraft release
    required: true

  # Docker Hub credentials (public registry)
  docker-username:
    description: Docker Hub username
    required: true
  docker-password:
    description: Docker Hub password
    required: true

  # Prime staging registry credentials
  prime-stg-registry:
    description: Prime staging registry URL
    required: true
  prime-stg-username:
    description: Prime staging registry username
    required: true
  prime-stg-password:
    description: Prime staging registry password
    required: true

  # Prime production registry credentials (optional - only for stable releases)
  prime-registry:
    description: Prime production registry URL
    required: false
    default: ""
  prime-username:
    description: Prime production registry username
    required: false
    default: ""
  prime-password:
    description: Prime production registry password
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - run: git fetch --force --tags
      shell: bash
    - name: Install go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: 1.26

    - uses: rancherlabs/dep-fetch/actions/sync-deps@35f5facb2f545a6ebbba91f8a635cf2511ade703 # v0.2.0
      with:
        version: v0.2.0

    - name: Run goreleaser
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      shell: bash
      run: |-
        goreleaser release --clean
        if [[ ! -f dist/metadata.json ]] || [[ ! -s dist/metadata.json ]]; then
          echo "Missing required file: dist/metadata.json"
          exit 1
        fi
        if [[ ! -f dist/artifacts.json ]] || [[ ! -s dist/artifacts.json ]]; then
          echo "Missing required file: dist/artifacts.json"
          exit 1
        fi
        echo "metadata=$(tr -d '\n\r' < dist/metadata.json)" >> "${GITHUB_OUTPUT}"
        echo "artifacts=$(tr -d '\n\r' < dist/artifacts.json)" >> "${GITHUB_OUTPUT}"

    # NOTE: SLSA attestation MUST be done in the calling workflow's job definition
    # (not in this composite action) due to OIDC token binding requirements.
    # See documentation in README.md for details.

    # NOTE: Vault secrets MUST be read in the calling workflow (not here)
    # and passed as inputs to this action. This action does not have access
    # to vault or the vars/secrets contexts.

    # This encapsulates: login, qemu, build/push
    - name: Build and push BRO image (dockerhub and prime stg)
      uses: rancher/ecm-distro-tools/actions/publish-image@4b93308a7a0a096e6001cda6a7b34f5bda215d13 # v0.74.2
      with:
        image: "backup-restore-operator"
        tag: ${{ github.ref_name }}
        public-registry: docker.io
        public-repo: rancher
        public-username: ${{ inputs.docker-username }}
        public-password: ${{ inputs.docker-password }}
        push-to-prime: true
        prime-registry: ${{ inputs.prime-stg-registry }}
        prime-repo: rancher
        prime-username: ${{ inputs.prime-stg-username }}
        prime-password: ${{ inputs.prime-stg-password }}
    - name: Check SemVer Characteristics
      id: semver_check
      shell: bash
      run: |
        # NOTE: This script is in the automation-core branch at .github/scripts/check-semver.sh
        # For now, we expect it to exist in the calling repo's .github/scripts/ directory
        # TODO: In P2, create a check-semver action that wraps this script
        bash ./.github/scripts/check-semver "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

    - name: Build and push BRO image (prime prod)
      if: ${{ steps.semver_check.outputs.HAS_PRERELEASE == 'false' && inputs.prime-registry != '' }}
      uses: rancher/ecm-distro-tools/actions/publish-image@4b93308a7a0a096e6001cda6a7b34f5bda215d13 # v0.74.2
      with:
        image: "backup-restore-operator"
        tag: ${{ github.ref_name }}
        push-to-public: false
        push-to-prime: true
        prime-registry: ${{ inputs.prime-registry }}
        prime-repo: rancher
        prime-username: ${{ inputs.prime-username }}
        prime-password: ${{ inputs.prime-password }}

    - name: Fully publish release (retry until visible)
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        set -euo pipefail
        tag="${{ github.ref_name }}"

        for i in {1..12}; do
          if gh release view -R "${{ github.repository }}" "$tag" >/dev/null 2>&1; then
            gh release edit -R "${{ github.repository }}" "$tag" --draft=false
            exit 0
          fi
          echo "Release '$tag' not found yet (attempt $i/12). Sleeping 10s..."
          sleep 10
        done

        echo "Release '$tag' still not found after retries; failing."
        exit 1
