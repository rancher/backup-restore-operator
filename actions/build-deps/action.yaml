name: build-deps
description: Install the tooling needed to run the CI build job

runs:
  using: composite
  steps:
    - name: Checkout bin-deps config to local branch
      shell: bash
      run: |
        git fetch origin automation-core
        git restore --source origin/automation-core .bin-deps.yaml

    - uses: rancherlabs/dep-fetch/actions/sync-deps@c20b0b0e73e0819fd96fab41e1ee8987714dd04b # v0.3.0

    - name: Remove bin-deps config
      shell: bash
      run: |
        rm .bin-deps.yaml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Install Helm v4
      shell: bash
      run: |
        # helm v4.2.3
        case "$(uname -m)" in
          x86_64)  ARCH=amd64; CHECKSUM="e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c" ;;
          aarch64) ARCH=arm64; CHECKSUM="21abd9354d39b2cd79a8d76be6912cd137a983cbf997193503fb8a6a6e2f2785" ;;
          *) echo "Unsupported: $(uname -m)"; exit 1 ;;
        esac
        TMP_DIR=$(mktemp -d)
        TMP_FILE="${TMP_DIR}/helmv4.tar.gz"
        curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
          "https://get.helm.sh/helm-v4.2.3-linux-${ARCH}.tar.gz" > "${TMP_FILE}"
        printf "%s  %s\n" "${CHECKSUM}" "${TMP_FILE}" | sha256sum -c -
        tar xzf "${TMP_FILE}" -C "${TMP_DIR}"
        install "${TMP_DIR}/linux-${ARCH}/helm" /usr/local/bin/helm
        rm -rf "${TMP_DIR}"
        helm version

    - name: Install Helm-unittest
      shell: bash
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

    - name: Set up chart-testing
      uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0
