# Configuration for release/v9.x branch
branch: release/v9.x

# Go version for CI (simple syntax: major.minor)
go: 1.25

# K3S versions for integration tests
k3s_versions:
  - v1.32.13-k3s1
  - v1.34.6-k3s1

# Automation-core reference (branch/tag/sha)
automation_core_ref: automation-core  # Rolling release from latest

# Workflow enablement
workflows:
  ci: true
  release: true
  head-builds: true
  fossa: true

# Metadata
description: "Release branch for BRO v9.x"
